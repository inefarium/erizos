<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title><-INEFARIUM: Mi Prenovia-></title>
<style>
  body {
    margin: 0;
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

  /* ---------- Boton para volver al index ---------- */
  .volver {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 50;
    color: #0ff;
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 1px;
    border: 1px solid #0ff;
    border-radius: 6px;
    padding: 8px 14px;
    background: rgba(0,0,0,0.6);
    text-shadow: 0 0 6px #0ff;
    box-shadow: 0 0 8px rgba(0,255,255,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .volver:hover {
    transform: scale(1.05);
    box-shadow: 0 0 14px rgba(0,255,255,0.7);
  }

  /* ===================== TARJETA HOLOGRAMA ===================== */
  .tarjeta-holograma {
    position: fixed;
    width: clamp(220px, 60vw, 320px);
    /* Arranca escondida abajo de la pantalla, transparente */
    transform: translateY(140%);
    opacity: 0;
    transition: transform 1.4s cubic-bezier(0.2, 0.8, 0.2, 1),
                opacity 1.1s ease;
    z-index: 10;
    pointer-events: none;
  }

  .tarjeta-holograma.visible {
    transform: translateY(0);
    opacity: 1;
  }

  .marco-holograma {
    position: relative;
    padding: 1.4em 1.2em;
    border: 1px solid #0ff;
    border-radius: 10px;
    background:
      linear-gradient(180deg, rgba(0,255,255,0.06), rgba(255,0,200,0.05));
    box-shadow:
      0 0 12px rgba(0,255,255,0.55),
      0 0 30px rgba(255,0,200,0.25),
      inset 0 0 18px rgba(0,255,255,0.15);
    overflow: hidden;
    /* Parpadeo sutil tipo holograma inestable */
    animation: parpadeoHolograma 3.6s infinite;
  }

  @keyframes parpadeoHolograma {
    0%, 100% { opacity: 1; }
    92%      { opacity: 1; }
    93%      { opacity: 0.55; }
    94%      { opacity: 1; }
    96%      { opacity: 0.7; }
    97%      { opacity: 1; }
  }

  /* Lineas de escaneo horizontales que se mueven, dan el look holograma */
  .marco-holograma::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,255,255,0.10) 0px,
      rgba(0,255,255,0.10) 1px,
      transparent 2px,
      transparent 4px
    );
    mix-blend-mode: screen;
    animation: desplazarLineas 5s linear infinite;
    pointer-events: none;
  }

  /* Barrido de brillo, como el escaneo de un proyector holografico */
  .marco-holograma::after {
    content: "";
    position: absolute;
    left: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(
      180deg,
      transparent 0%,
      rgba(0,255,255,0.22) 50%,
      transparent 100%
    );
    animation: barridoTarjeta 4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes desplazarLineas {
    0%   { background-position-y: 0; }
    100% { background-position-y: 40px; }
  }

  @keyframes barridoTarjeta {
    0%   { top: -40%; }
    50%  { top: 100%; }
    100% { top: -40%; }
  }

  .titulo-holograma {
    margin: 0 0 0.5em 0;
    font-size: 1.15rem;
    color: #0ff;
    text-shadow: 0 0 6px #0ff, 0 0 14px #0ff;
    letter-spacing: 2px;
    text-align: center;
  }

  .cuerpo-holograma {
    margin: 0;
    font-size: 0.85rem;
    line-height: 1.5em;
    color: #ff00c8;
    text-shadow: 0 0 5px #ff00c8;
    text-align: center;
    letter-spacing: 0.5px;
  }

  .firma-holograma {
    margin-top: 0.9em;
    font-size: 0.75rem;
    color: #0ff;
    opacity: 0.75;
    text-align: right;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<a class="volver" href="index.html">‹ Volver</a>

<div class="tarjeta-holograma" id="tarjetaHolograma">
  <div class="marco-holograma">
    <h2 class="titulo-holograma">TRANSMISIÓN INEFARIUM</h2>
    <p class="cuerpo-holograma">
      En el suspiro de nuestro mundo soñado...<br>
      En aquello que a sido magnificado...<br>
      En el pensamiento de tu linda existencia...<br>
      En mi prenovia... mi amada Princesa...
    </p>
  </div>
</div>

<script>
  const tarjeta = document.getElementById('tarjetaHolograma');

  // Estado del movimiento (rebote tipo screensaver, lento)
  let x = 0, y = 0, vx = 0, vy = 0;
  let animandoDrift = null;
  let ancho = 0, alto = 0;

  function medirTarjeta() {
    ancho = tarjeta.offsetWidth || 260;
    alto = tarjeta.offsetHeight || 160;
  }

  function posicionInicialAleatoria() {
    medirTarjeta();
    const maxX = Math.max(window.innerWidth - ancho, 0);
    x = Math.random() * maxX;
    y = window.innerHeight - alto; // aparece pegada abajo antes de subir
    tarjeta.style.left = x + 'px';
    tarjeta.style.top = (window.innerHeight * 0.35 + Math.random() * window.innerHeight * 0.25) + 'px';

    // Direccion de deriva lenta y aleatoria
    const velocidad = 0.15 + Math.random() * 0.15; // muy lento
    const angulo = Math.random() * Math.PI * 2;
    vx = Math.cos(angulo) * velocidad;
    vy = Math.sin(angulo) * velocidad;
  }

  function iniciarDrift() {
    medirTarjeta();
    let posX = parseFloat(tarjeta.style.left) || 0;
    let posY = parseFloat(tarjeta.style.top) || 0;

    function paso() {
      posX += vx;
      posY += vy;

      // Rebote en los bordes de la pantalla
      if (posX <= 0) { posX = 0; vx *= -1; }
      if (posX + ancho >= window.innerWidth) { posX = window.innerWidth - ancho; vx *= -1; }
      if (posY <= 0) { posY = 0; vy *= -1; }
      if (posY + alto >= window.innerHeight) { posY = window.innerHeight - alto; vy *= -1; }

      tarjeta.style.left = posX + 'px';
      tarjeta.style.top = posY + 'px';

      animandoDrift = requestAnimationFrame(paso);
    }
    animandoDrift = requestAnimationFrame(paso);
  }

  function detenerDrift() {
    if (animandoDrift) cancelAnimationFrame(animandoDrift);
    animandoDrift = null;
  }

  function ciclarAparicion() {
    // 1. Posiciona en un lugar aleatorio y la muestra (sube desde abajo)
    posicionInicialAleatoria();
    requestAnimationFrame(() => {
      tarjeta.classList.add('visible');
    });

    // 2. Tras la animacion de entrada, empieza a derivar lentamente
    setTimeout(() => {
      iniciarDrift();
    }, 1450);

    // 3. Permanece visible un tiempo aleatorio, luego se esconde
    const tiempoVisible = 6000 + Math.random() * 5000;
    setTimeout(() => {
      detenerDrift();
      tarjeta.classList.remove('visible');

      // 4. Espera un tiempo aleatorio escondida y vuelve a aparecer
      const tiempoEscondida = 2500 + Math.random() * 4000;
      setTimeout(ciclarAparicion, tiempoEscondida);
    }, tiempoVisible);
  }

  window.addEventListener('resize', medirTarjeta);
  ciclarAparicion();
</script>

</body>
</html>
