<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INEFARIUM: Nuestro Libro</title>

<style>

  /* ============================================================
     CONFIGURACIÓN GENERAL
     ============================================================ */

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background: #000;

    font-family: 'Courier New', monospace;

    color: #0ff;
  }


  /* ============================================================
     BOTÓN VOLVER
     ============================================================ */

  .volver {
    position: fixed;

    top: 16px;
    left: 16px;

    z-index: 100;

    color: #0ff;
    text-decoration: none;

    font-size: 0.9rem;
    letter-spacing: 1px;

    border: 1px solid #0ff;
    border-radius: 6px;

    padding: 8px 14px;

    background: rgba(0, 0, 0, 0.65);

    text-shadow:
      0 0 6px #0ff;

    box-shadow:
      0 0 8px rgba(0,255,255,0.35);

    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease;
  }

  .volver:hover {
    transform: scale(1.05);

    box-shadow:
      0 0 14px rgba(0,255,255,0.7);
  }


  /* ============================================================
     ESCENA DEL LIBRO
     ============================================================ */

  .escena-libro {

    position: fixed;

    left: 50%;
    bottom: 8%;

    /* ---- Entrada estilo holograma (igual a "mi prenovia"),
           pero ESTÁTICA: aparece una vez y se queda fija ---- */
    opacity: 0;
    transform: translateX(-50%) translateY(120%);
    transition:
      transform 1.4s cubic-bezier(0.2, 0.8, 0.2, 1),
      opacity 1.1s ease;

    width: min(720px, 90vw);
    height: min(420px, 55vh);

    display: flex;

    align-items: center;
    justify-content: center;

    perspective: 1800px;

    z-index: 20;
  }

  .escena-libro.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Líneas de escaneo tipo holograma, decorativas, no bloquean clicks */
  .escena-libro::before {
    content: "";
    position: absolute;
    inset: -24px;
    border-radius: 18px;

    background: repeating-linear-gradient(
      0deg,
      rgba(0,255,255,0.08) 0px,
      rgba(0,255,255,0.08) 1px,
      transparent 2px,
      transparent 4px
    );

    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 5;
  }

  /* Resplandor parpadeante tipo holograma inestable, decorativo */
  .escena-libro::after {
    content: "";
    position: absolute;
    inset: -24px;
    border-radius: 18px;

    box-shadow:
      0 0 18px rgba(0,255,255,0.35),
      inset 0 0 26px rgba(0,255,255,0.12);

    pointer-events: none;
    z-index: 6;

    animation: parpadeoHolograma 3.6s infinite;
  }

  @keyframes parpadeoHolograma {
    0%, 100% { opacity: 1; }
    92%      { opacity: 1; }
    93%      { opacity: 0.55; }
    94%      { opacity: 1; }
    96%      { opacity: 0.7; }
    97%      { opacity: 1; }
  }


  /* ============================================================
     LIBRO CERRADO
     ============================================================ */

  .libro {

    position: relative;

    width: 330px;
    height: 210px;

    cursor: pointer;

    transform-style: preserve-3d;

    transition:
      transform 0.8s ease,
      width 0.8s ease,
      height 0.8s ease;

    filter:
      drop-shadow(0 0 12px rgba(0,255,255,0.35))
      drop-shadow(0 0 25px rgba(255,0,200,0.15));
  }

  .libro:hover {
    transform:
      translateY(-8px)
      rotateX(4deg);
  }


  /* ============================================================
     PORTADA
     ============================================================ */

  .portada {

    position: absolute;

    inset: 0;

    z-index: 10;

    transform-origin: left center;

    transform-style: preserve-3d;

    backface-visibility: hidden;

    transition:
      transform 1.4s cubic-bezier(0.65, 0, 0.35, 1);

    background:
      linear-gradient(
        135deg,
        #050505,
        #101010 45%,
        #050505
      );

    border: 1px solid #0ff;

    border-radius: 4px 10px 10px 4px;

    box-shadow:
      inset 0 0 25px rgba(0,255,255,0.08),
      0 0 10px rgba(0,255,255,0.4);
  }


  /* Borde de la tapa */

  .portada::before {

    content: "";

    position: absolute;

    inset: 12px;

    border: 1px solid rgba(0,255,255,0.55);

    box-shadow:
      inset 0 0 12px rgba(0,255,255,0.15);

    pointer-events: none;
  }


  /* Decoración de la portada */

  .decoracion-portada {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 30px;
  }

  .titulo-portada {

    margin: 0;

    color: #0ff;

    font-size: clamp(1.2rem, 3vw, 1.8rem);

    letter-spacing: 5px;

    text-shadow:
      0 0 5px #0ff,
      0 0 15px #0ff;
  }

  .subtitulo-portada {

    margin-top: 18px;

    color: #ff00c8;

    font-size: 0.8rem;

    letter-spacing: 2px;

    text-shadow:
      0 0 6px #ff00c8;
  }


  /* ============================================================
     LOMO DEL LIBRO
     ============================================================ */

  .lomo {

    position: absolute;

    left: -10px;
    top: 0;

    width: 12px;
    height: 100%;

    background:
      linear-gradient(
        90deg,
        #050505,
        #0ff,
        #050505
      );

    box-shadow:
      0 0 8px rgba(0,255,255,0.5);

    z-index: 15;
  }


  /* ============================================================
     PÁGINAS INTERNAS
     ============================================================ */

  .pagina {

    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background:
      linear-gradient(
        90deg,
        #080808,
        #101010
      );

    border: 1px solid rgba(0,255,255,0.35);

    overflow: hidden;
  }

  .pagina-izquierda {

    left: 0;

    border-radius:
      8px 0 0 8px;

    transform-origin: right center;
  }

  .pagina-derecha {

    right: 0;

    border-radius:
      0 8px 8px 0;
  }


  /* ============================================================
     CONTENIDO DE LAS PÁGINAS
     ============================================================ */

  .contenido-pagina {

    width: 100%;
    height: 100%;

    padding: 22px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
  }


  .numero-pagina {

    position: absolute;

    bottom: 10px;

    font-size: 0.65rem;

    color: rgba(0,255,255,0.45);

    letter-spacing: 1px;
  }


  .titulo-pagina {

    color: #0ff;

    font-size: 1rem;

    letter-spacing: 2px;

    margin-bottom: 15px;

    text-shadow:
      0 0 6px #0ff;
  }


  .texto-pagina {

    color: #ff00c8;

    font-size: 0.75rem;

    line-height: 1.6;

    text-shadow:
      0 0 5px rgba(255,0,200,0.6);
  }


  /* ============================================================
     FOTOGRAFÍAS
     ============================================================ */

  .foto-pagina {

    width: 85%;
    height: 70%;

    object-fit: cover;

    border: 1px solid #0ff;

    padding: 4px;

    background: #000;

    box-shadow:
      0 0 10px rgba(0,255,255,0.35);

    transition:
      transform 0.4s ease,
      box-shadow 0.4s ease;
  }

  .foto-pagina:hover {

    transform: scale(1.03);

    box-shadow:
      0 0 18px rgba(0,255,255,0.65);
  }


  /* ============================================================
     LIBRO ABIERTO
     ============================================================ */

  .libro.abierto {

    width: 650px;

    height: 400px;

    cursor: default;
  }


  .libro.abierto:hover {

    transform: none;
  }


  .libro.abierto .portada {

    transform:
      rotateY(-180deg);

    pointer-events: none;
  }


  /* ============================================================
     CONTROLES
     ============================================================ */

  .controles {

    position: fixed;

    left: 50%;
    bottom: 3%;

    transform: translateX(-50%);

    display: flex;

    gap: 12px;

    z-index: 50;

    opacity: 0;

    pointer-events: none;

    transition:
      opacity 0.5s ease;
  }

  /* La clase "libro-abierto-activo" ahora vive en <body>, que SÍ es
     ancestro de .controles (antes estaba en #escenaLibro, que es
     hermano de #controles, por eso el selector nunca aplicaba y
     los botones quedaban invisibles / no clickeables). */
  .libro-abierto-activo .controles {

    opacity: 1;

    pointer-events: auto;
  }


  .control {

    color: #0ff;

    background:
      rgba(0,0,0,0.8);

    border: 1px solid #0ff;

    border-radius: 5px;

    padding: 8px 16px;

    font-family:
      'Courier New',
      monospace;

    cursor: pointer;

    text-shadow:
      0 0 5px #0ff;

    box-shadow:
      0 0 8px rgba(0,255,255,0.25);

    transition:
      background 0.2s ease,
      transform 0.2s ease;
  }

  .control:hover {

    background:
      rgba(0,255,255,0.1);

    transform:
      scale(1.05);
  }

  .control:disabled {

    opacity: 0.35;

    cursor: not-allowed;

    transform: none;
  }


  /* ============================================================
     INDICADOR "ABRIR"
     ============================================================ */

  .indicador-abrir {

    position: absolute;

    bottom: -38px;

    width: 100%;

    text-align: center;

    color: #ff00c8;

    font-size: 0.7rem;

    letter-spacing: 2px;

    text-shadow:
      0 0 6px #ff00c8;

    animation:
      parpadear 2s infinite;
  }

  @keyframes parpadear {

    0%, 100% {
      opacity: 0.5;
    }

    50% {
      opacity: 1;
    }
  }


  /* ============================================================
     OCULTAR INDICADOR AL ABRIR
     ============================================================ */

  .libro-abierto-activo .indicador-abrir {

    display: none;
  }


  /* ============================================================
     RESPONSIVE
     ============================================================ */

  @media (max-width: 700px) {

    .escena-libro {

      bottom: 12%;

      height: 330px;
    }

    .libro {

      width: 270px;
      height: 175px;
    }

    .libro.abierto {

      width: 90vw;
      height: 55vw;

      max-height: 330px;
    }

    .contenido-pagina {

      padding: 10px;
    }

    .titulo-pagina {

      font-size: 0.75rem;
    }

    .texto-pagina {

      font-size: 0.6rem;
    }

    .foto-pagina {

      width: 90%;
      height: 65%;
    }
  }

</style>
</head>


<body>


<!-- ============================================================
     BOTÓN VOLVER
     ============================================================ -->

<a
  href="index.html"
  class="volver"
>
  ‹ Volver
</a>



<!-- ============================================================
     ESCENA
     ============================================================ -->

<div
  class="escena-libro"
  id="escenaLibro"
>


  <!-- ==========================================================
       LIBRO
       ========================================================== -->

  <div
    class="libro"
    id="libro"
  >


    <!-- ========================================================
         PÁGINA IZQUIERDA
         ======================================================== -->

    <div
      class="pagina pagina-izquierda"
      id="paginaIzquierda"
    >

      <div
        class="contenido-pagina"
        id="contenidoIzquierda"
      >
      </div>

    </div>



    <!-- ========================================================
         PÁGINA DERECHA
         ======================================================== -->

    <div
      class="pagina pagina-derecha"
      id="paginaDerecha"
    >

      <div
        class="contenido-pagina"
        id="contenidoDerecha"
      >
      </div>

    </div>



    <!-- ========================================================
         PORTADA
         ======================================================== -->

    <div
      class="portada"
      id="portada"
    >

      <div class="decoracion-portada">

        <h1 class="titulo-portada">
          INEFARIUM
        </h1>

        <div class="subtitulo-portada">
          NUESTRO PEQUEÑO UNIVERSO
        </div>

      </div>

    </div>


    <!-- Lomo -->

    <div class="lomo"></div>


    <!-- Indicador -->

    <div class="indicador-abrir">
      TOCA PARA ABRIR
    </div>

  </div>

</div>



<!-- ============================================================
     CONTROLES DEL LIBRO
     ============================================================ -->

<div
  class="controles"
  id="controles"
>

  <button
    type="button"
    class="control"
    id="anterior"
  >
    ‹ Anterior
  </button>

  <button
    type="button"
    class="control"
    id="cerrar"
  >
    Cerrar libro
  </button>

  <button
    type="button"
    class="control"
    id="siguiente"
  >
    Siguiente ›
  </button>

</div>



<script>

  /* ============================================================
     CONFIGURACIÓN DEL LIBRO

     AQUÍ AGREGARÁS LAS FOTOS.

     Puedes añadir tantas páginas como quieras.

     Ejemplo:

     {
       tipo: "foto",
       imagen: "fotos/foto4.jpg",
       titulo: "Nuestro momento",
       texto: "Una pequeña memoria..."
     }

     ============================================================ */

  const paginas = [

    {
      tipo: "inicio",

      titulo: "AQUEL SUEÑO DE LIBRO QUE SE PERSONIFICO",

      texto:
        "Acaso vienes de una fantasia lejana? o simplemente te volviste la luz de las paginas de mi vida"
    },


    {
      tipo: "foto",

      imagen: "fotos/foto1.jpg",

      titulo: "Página I",

      texto:
        "La hora azul del mejor cumpleaños que tube..."
    },


    {
      tipo: "foto",

      imagen: "fotos/foto2.jpeg",

      titulo: "Página II",

      texto:
        "Un amanecer que brilla tanto como tu..."
    },


    {
      tipo: "foto",

      imagen: "fotos/foto3.jpeg",

      titulo: "Página III",

      texto:
        "Volverme en humo para poder ir a abrazarte..."
    },


    {
      tipo: "final",

      titulo: "FIN?",

      texto:
        "Solo el final de estas paginas holograficas (espera a mas fotitos :3)"
    }

  ];



  /* ============================================================
     VARIABLES
     ============================================================ */

  const libro =
    document.getElementById("libro");

  const escenaLibro =
    document.getElementById("escenaLibro");

  const contenidoIzquierda =
    document.getElementById("contenidoIzquierda");

  const contenidoDerecha =
    document.getElementById("contenidoDerecha");

  const controles =
    document.getElementById("controles");

  const anterior =
    document.getElementById("anterior");

  const siguiente =
    document.getElementById("siguiente");

  const cerrar =
    document.getElementById("cerrar");


  let libroAbierto = false;

  let paginaActual = 0;



  /* ============================================================
     GENERAR CONTENIDO
     ============================================================ */

  function generarPagina(pagina, numero) {

    if (!pagina) {

      return `
        <div class="contenido-pagina">
        </div>
      `;
    }


    /* ----------------------------------------------------------
       PÁGINA CON FOTO
       ---------------------------------------------------------- */

    if (pagina.tipo === "foto") {

      return `

        <div class="contenido-pagina">

          <div class="titulo-pagina">
            ${pagina.titulo}
          </div>

          <img
            class="foto-pagina"
            src="${pagina.imagen}"
            alt="${pagina.titulo}"
          >

          <div class="texto-pagina">
            ${pagina.texto}
          </div>

          <div class="numero-pagina">
            ${numero}
          </div>

        </div>

      `;
    }


    /* ----------------------------------------------------------
       PÁGINA INICIAL / FINAL
       ---------------------------------------------------------- */

    return `

      <div class="contenido-pagina">

        <div class="titulo-pagina">
          ${pagina.titulo}
        </div>

        <div class="texto-pagina">
          ${pagina.texto}
        </div>

        <div class="numero-pagina">
          ${numero}
        </div>

      </div>

    `;
  }



  /* ============================================================
     ACTUALIZAR PÁGINAS
     ============================================================ */

  function actualizarPaginas() {

    const izquierda =
      paginas[paginaActual];

    const derecha =
      paginas[paginaActual + 1];


    contenidoIzquierda.innerHTML =
      generarPagina(
        izquierda,
        paginaActual + 1
      );


    contenidoDerecha.innerHTML =
      generarPagina(
        derecha,
        paginaActual + 2
      );


    anterior.disabled =
      paginaActual <= 0;


    siguiente.disabled =
      paginaActual + 2 >= paginas.length;

  }



  /* ============================================================
     ABRIR LIBRO
     ============================================================ */

  function abrirLibro() {

    if (libroAbierto) {
      return;
    }

    libroAbierto = true;

    paginaActual = 0;

    libro.classList.add("abierto");

    /* Se activa en <body> (ancestro real de #controles) en vez de
       en #escenaLibro, que es hermano de #controles y por eso
       nunca hacía que los botones se volvieran clickeables. */
    document.body.classList.add(
      "libro-abierto-activo"
    );


    actualizarPaginas();

  }



  /* ============================================================
     CERRAR LIBRO
     ============================================================ */

  function cerrarLibro() {

    libroAbierto = false;

    libro.classList.remove("abierto");

    document.body.classList.remove(
      "libro-abierto-activo"
    );

  }



  /* ============================================================
     SIGUIENTE PÁGINA
     ============================================================ */

  function irSiguiente() {

    if (!libroAbierto) {
      return;
    }


    if (paginaActual + 2 >= paginas.length) {
      return;
    }


    paginaActual += 2;

    actualizarPaginas();

  }



  /* ============================================================
     PÁGINA ANTERIOR
     ============================================================ */

  function irAnterior() {

    if (!libroAbierto) {
      return;
    }


    if (paginaActual <= 0) {
      return;
    }


    paginaActual -= 2;

    actualizarPaginas();

  }



  /* ============================================================
     EVENTOS
     ============================================================ */

  libro.addEventListener(
    "click",
    abrirLibro
  );


  siguiente.addEventListener(
    "click",
    irSiguiente
  );


  anterior.addEventListener(
    "click",
    irAnterior
  );


  cerrar.addEventListener(
    "click",
    cerrarLibro
  );



  /* ============================================================
     SOPORTE PARA TECLADO
     ============================================================ */

  document.addEventListener(
    "keydown",
    (evento) => {

      if (!libroAbierto) {
        return;
      }


      if (evento.key === "ArrowRight") {

        irSiguiente();

      }


      if (evento.key === "ArrowLeft") {

        irAnterior();

      }


      if (evento.key === "Escape") {

        cerrarLibro();

      }

    }
  );



  /* ============================================================
     APARICIÓN ESTILO HOLOGRAMA (igual mecánica visual que en
     "mi prenovia": fade-in subiendo desde abajo + parpadeo),
     pero ESTÁTICA: se dispara una sola vez al cargar y el libro
     se queda fijo en su lugar, sin deriva ni reaparición cíclica.
     ============================================================ */

  window.addEventListener("load", () => {

    requestAnimationFrame(() => {

      escenaLibro.classList.add("visible");

    });

  });


</script>

</body>
</html>
